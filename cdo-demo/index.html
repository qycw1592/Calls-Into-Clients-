<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<meta name="description" content="A tailored interactive Calls Into Clients OS concept for CDO Glass — from first inquiry to completed job.">
<meta property="og:title" content="CDO Glass × Calls Into Clients OS">
<meta property="og:description" content="A tailored 3-minute interactive concept: qualify leads, organize measurements, recover estimates, and see owner-level revenue visibility.">
<meta property="og:type" content="website">
<title>CDO Glass × Calls Into Clients OS</title>
<style>
html,body{margin:0;min-height:100%;background:#071018;color:#f6fbff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.boot-card{max-width:560px;padding:30px;border-radius:24px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);text-align:center}.boot-mark{width:42px;height:42px;margin:0 auto 16px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#55d7f2,#4aa8ff);color:#041117;font-size:12px;font-weight:900}.boot-muted{color:#9aa8b5;line-height:1.55}.boot-spin{width:22px;height:22px;border:2px solid rgba(255,255,255,.16);border-top-color:#55d7f2;border-radius:50%;margin:18px auto 0;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="boot"><div class="boot-card"><div class="boot-mark">CIC</div><h2>CDO Glass × Calls Into Clients OS</h2><p class="boot-muted">Loading the tailored interactive demonstration…</p><div class="boot-spin"></div></div></div>
<script>
(async()=>{
  const root='https://raw.githubusercontent.com/qycw1592/Calls-Into-Clients-/main/cdo-demo/';
  const v='20260824-qa2';
  try{
    const [cssRes,bodyRes,jsRes]=await Promise.all([
      fetch(root+'style.css?v='+v,{cache:'no-store'}),
      fetch(root+'body.html?v='+v,{cache:'no-store'}),
      fetch(root+'app.js?v='+v,{cache:'no-store'})
    ]);
    if(!cssRes.ok||!bodyRes.ok||!jsRes.ok) throw new Error('Demo assets unavailable');
    const [css,body,js]=await Promise.all([cssRes.text(),bodyRes.text(),jsRes.text()]);
    const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
    document.body.innerHTML=body;
    const script=document.createElement('script');script.textContent=js;document.body.appendChild(script);
  }catch(err){
    document.body.innerHTML='<div class="boot"><div class="boot-card"><div class="boot-mark">CIC</div><h2>Demo temporarily unavailable</h2><p class="boot-muted">Please refresh the page. The interactive assets could not be loaded.</p></div></div>';
  }
})();
</script>
</body>
</html>
